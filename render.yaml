services:
  - type: web
    name: deepresearch-agent
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GOOGLE_API_KEY
        sync: false
